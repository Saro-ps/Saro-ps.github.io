<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);

var STAT_OK = 'zaza_cache_ok', STAT_FAIL = 'zaza_cache_fail';
var okCount = parseInt(localStorage.getItem(STAT_OK) || '0', 10);
var failCount = parseInt(localStorage.getItem(STAT_FAIL) || '0', 10);
var statCounted = false;

function paintStats(){
  var okEl = document.getElementById('okCount');
  var failEl = document.getElementById('failCount');
  if (okEl) okEl.textContent = okCount;
  if (failEl) failEl.textContent = failCount;
}
document.addEventListener('DOMContentLoaded', paintStats);

function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Installing Offline Cache: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Cache Installed Successfully ✔";setTimeout(function(){window.msgs.innerHTML="Now Close And Re-Open Your Browser ...";},1500);}

window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){
  DisplayCacheProgress();
  if(!statCounted){statCounted=true;okCount++;localStorage.setItem(STAT_OK,okCount);paintStats();}
};
window.applicationCache.onupdateready=function(e){
  DisplayCacheProgress();
  if(!statCounted){statCounted=true;okCount++;localStorage.setItem(STAT_OK,okCount);paintStats();}
};
window.applicationCache.onerror=function(e){
  window.msgs.innerHTML="Error Installing Cache! - Clear and Re-Open Your Browser ...";
  if(!statCounted){statCounted=true;failCount++;localStorage.setItem(STAT_FAIL,failCount);paintStats();}
};
</script>

<div class="page loader-page">

  <header class="hero">

  <div class="loader-stats" aria-live="polite">

    <span class="stat stat-fail">✕ فشل <b id="failCount">0</b></span>
