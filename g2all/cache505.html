<script>
/* Adaptive calm mode. Watches how smoothly the browser draws; if it keeps dropping below ~14 fps
   (or freezes for a moment) it adds "still" to <html>, which stops every animation, and remembers it for an hour.
   It only measures time - it never touches the host scripts or #msgs. */
(function () {
  var root = document.documentElement;
  if (root.className.indexOf("still") > -1) return;
  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame;
  var last = 0, frames = 0, slow = 0, sum = 0, start = new Date().getTime(), winStart = start, done = false;
  function calm() {
    done = true;
    root.className += " still";
    try { localStorage.setItem("spCalm", String(new Date().getTime())); } catch (e) {}
  }
  function sample(t, slowAt, avgAt) {
    if (done) return;
    if (document.hidden || document.webkitHidden) { last = 0; winStart = t; frames = slow = sum = 0; return; }
    if (last) {
      var d = t - last;
      frames++; sum += (d > 1000 ? 1000 : d);
      if (d > slowAt) slow++;
    }
    last = t;
    if (t - winStart >= 2500) {
      if (t - start > 1500 && frames > 4 && (slow / frames >= 0.3 || sum / frames > avgAt)) { calm(); return; }
      frames = slow = sum = 0; winStart = t;
    }
  }
  if (raf) {
    (function tick() { if (done) return; sample(new Date().getTime(), 90, 70); raf.call(window, tick); })();
  } else {
    setInterval(function () { sample(new Date().getTime(), 250, 180); }, 100);
  }
})();
</script>

   The ranges below are the same ones index.html uses to pick an exploit:
   5.05 / 5.07, 7.00-8.52, 9.00-9.60, 10.00-11.02, 11.50-12.02,
   12.50-13.00, 13.02-13.52 and 14.00. */
(function () {
  var el = document.getElementById("fwbadge");
  if (!el) return;
  var m = navigator.userAgent.match(/PlayStation 4[ \/]([\d.]+)/i);
  var ver = m ? m[1] : "", v = m ? parseFloat(m[1]) : 0;
  var ok = m && (v === 5.05 || v === 5.07 ||
    (v >= 7.00 && v <= 8.52) || (v >= 9.00 && v <= 9.60) ||
    (v >= 10.00 && v <= 11.02) || (v >= 11.50 && v <= 12.02) ||
    (v >= 12.50 && v <= 13.00) || (v >= 13.02 && v <= 13.52) || v === 14.00);
  var icon = ok
    ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11"/><path d="M6.5 12.6l3.8 3.8 7.2-8" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'

  el.className = "fw-badge " + (ok ? "is-ok" : "is-bad");
  if (!m) {
    el.innerHTML = icon + '<span class="fw-txt">\u0644\u064a\u0633 \u062c\u0647\u0627\u0632 PS4</span>';
  } else {

      (ok ? "\u0645\u062f\u0639\u0648\u0645" : "\u063a\u064a\u0631 \u0645\u062f\u0639\u0648\u0645") + '</span>';

})();
